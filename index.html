<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 학교 쓰레기통 동적 지도 서비스</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2e7d32; --primary-light: #e8f5e9; --primary-dark: #1b5e20; --accent-color: #ff9100;
            --drag-color: #00e5ff; --zone-color: #2962ff; --zone-light: rgba(41, 98, 255, 0.05); --zone-hover: rgba(41, 98, 255, 0.2);
            --danger-color: #e53935; --danger-light: #ffebee; --text-dark: #333333; --bg-light: #f4f6f8; --white: #ffffff; --gray-border: #cccccc;
            --spot-green: #2e7d32; --spot-yellow: #fbc02d; --spot-red: #d32f2f;
        }
        body { font-family: 'Segoe UI', AppleSDGothicNeo-Regular, sans-serif; text-align: center; background-color: var(--bg-light); margin: 0; padding: 12px; color: var(--text-dark); user-select: none; -webkit-user-select: none; }
        header { margin-bottom: 15px; padding: 0 10px; }
        h2 { color: var(--primary-dark); margin: 5px 0; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .subtitle { color: #666; margin-top: 2px; font-size: 13px; font-weight: 500; }
        
        /* 🌐 연동 스위치 스타일 */
        .sync-panel { background: #fff; max-width: 850px; margin: 0 auto 10px auto; padding: 10px 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
        .switch-label { font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(24px); }
        .status-badge { font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .status-on { background: #e8f5e9; color: #2e7d32; }
        .status-off { background: #eceff1; color: #455a64; }

        .guide-box { background-color: var(--white); border-left: 5px solid var(--primary-color); padding: 12px 16px; max-width: 850px; margin: 0 auto 12px auto; border-radius: 4px 10px 10px 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); text-align: left; font-size: 13px; line-height: 1.6; word-break: keep-all; }
        .guide-title { font-weight: bold; color: var(--primary-dark); display: block; margin-bottom: 5px; font-size: 14px; }
        .control-panel { max-width: 850px; margin: 0 auto 12px auto; display: flex; flex-direction: column; gap: 12px; background: var(--white); padding: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .btn-group { display: flex; gap: 8px; justify-content: center; width: 100%; }
        
        .floor-btn { flex: 1; max-width: 120px; padding: 10px 0; font-size: 13.5px; font-weight: 600; cursor: pointer; border-radius: 25px; border: 1.5px solid #ddd; background-color: var(--white); color: #555; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .floor-btn.active { background-color: var(--primary-color); border-color: var(--primary-color); color: var(--white); font-weight: bold; box-shadow: 0 3px 8px rgba(46, 125, 50, 0.2); }
        
        .action-btn { width: 100%; max-width: 320px; padding: 11px 0; font-size: 13px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; -webkit-tap-highlight-color: transparent; }
        .btn-db-reset { background-color: #616161; color: white; }
        #map-wrapper { position: relative; width: 100%; max-width: 850px; margin: 0 auto; border-radius: 12px; box-shadow: 0 0 0 3px var(--white), 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; background-color: #eaeaea; cursor: crosshair; touch-action: none; }
        #map-image { width: 100%; height: auto; display: block; -webkit-user-drag: none; user-select: none; }
        
        .zone-highlight { position: absolute; border: 2px dashed var(--zone-color); background-color: var(--zone-light); border-radius: 6px; cursor: pointer; transition: all 0.2s ease; z-index: 5; -webkit-tap-highlight-color: transparent; }
        .zone-highlight:hover { background-color: var(--zone-hover); box-shadow: 0 0 10px rgba(41, 98, 255, 0.4); z-index: 10; border-style: solid; }
        
        .zone-highlight.spot-green { border-color: var(--spot-green); background-color: rgba(46, 125, 50, 0.05); }
        .zone-highlight.spot-green:hover { background-color: rgba(46, 125, 50, 0.15); box-shadow: 0 0 10px rgba(46, 125, 50, 0.4); }
        .zone-highlight.spot-yellow { border-color: var(--spot-yellow); background-color: rgba(251, 192, 45, 0.05); }
        .zone-highlight.spot-yellow:hover { background-color: rgba(251, 192, 45, 0.15); box-shadow: 0 0 10px rgba(251, 192, 45, 0.4); }
        .zone-highlight.spot-red { border-color: var(--spot-red); background-color: rgba(211, 47, 47, 0.05); }
        .zone-highlight.spot-red:hover { background-color: rgba(211, 47, 47, 0.15); box-shadow: 0 0 10px rgba(211, 47, 47, 0.4); }

        #drag-guide-box { position: absolute; border: 2px dashed var(--drag-color); background-color: rgba(0, 229, 255, 0.15); border-radius: 6px; display: none; z-index: 8; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 15px; box-sizing: border-box; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--white); padding: 20px; border-radius: 16px; text-align: left; max-width: 460px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.25); box-sizing: border-box; position: relative; }
        
        .modal-header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-content h3 { margin: 0; color: var(--primary-dark); font-size: 17px; }
        
        .edit-inline-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #555; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; transition: all 0.2s; font-weight: 600; }
        .edit-inline-btn:hover { background-color: #f0f0f0; color: var(--primary-color); }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1.5px solid var(--gray-border); border-radius: 8px; box-sizing: border-box; font-size: 14px; background-color: var(--white); }
        .error-message { color: var(--danger-color); font-size: 12px; font-weight: 600; margin-top: 5px; display: none; background-color: var(--danger-light); padding: 6px 10px; border-radius: 6px; }
        
        .checkbox-grid { display: flex; flex-direction: column; gap: 10px; background: #f8f9fa; padding: 14px; border-radius: 8px; border: 1px dashed #ccc; box-sizing: border-box; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; user-select: none; width: 100%; box-sizing: border-box; }
        .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; margin: 0; padding: 0; flex-shrink: 0; cursor: pointer; }
        .checkbox-item span { line-height: 18px; font-weight: 500; color: #333; }

        .lock-option-box { background-color: #e8f5e9; border: 1px solid #a5d6a7; padding: 10px 14px; border-radius: 8px; margin-top: 12px; }

        .info-pill-container { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
        .info-pill { padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; color: white; }
        .pill-general { background-color: #2e7d32; } .pill-mix { background-color: #9c27b0; } .pill-pet { background-color: #1e88e5; } .pill-paper { background-color: #ff8f00; } .pill-danger { background-color: #e53935; } .pill-lock { background-color: #37474f; }
        
        .pill-spot-green { background-color: var(--spot-green); }
        .pill-spot-yellow { background-color: #f57f17; color: #fff; }
        .pill-spot-red { background-color: var(--spot-red); }

        .modal-buttons { display: flex; gap: 8px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 11px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-cancel { background-color: #eeeeee; color: #666; } .btn-save { background-color: var(--primary-color); color: var(--white); } .btn-delete { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .info-label { font-weight: 600; color: #555; display: inline-block; width: 75px; font-size: 13.5px; }

        @media (min-width: 520px) {
            body { padding: 20px; }
            h2 { font-size: 24px; }
            .control-panel { flex-direction: row; justify-content: space-between; align-items: center; padding: 15px; gap: 20px; }
            .btn-group { width: auto; gap: 12px; }
            .floor-btn { max-width: 140px; padding: 14px 28px; font-size: 16px; border-radius: 30px; }
            .action-btn { width: auto; padding: 14px 24px; font-size: 14.5px; }
            .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
            .checkbox-item.full-width { grid-column: span 2; }
        }
    </style>
</head>
<body>
    <header>
        <h2>🧹 교내 쓰레기통 참여형 지도 📍</h2>
        <p class="subtitle">학급 특색 활동: 분리수거 및 무단 투기 실태 시각화</p>
    </header>

    <div class="sync-panel">
        <div class="switch-label">
            🌐 실시간 전교생 지도 연동 
            <span id="sync-status" class="status-badge status-off">오프라인 모드</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="sync-toggle" onchange="toggleSyncMode()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="guide-box">
        <span class="guide-title">💡 1초만에 마스터하는 지도 사용법!</span>
        1. 원하는 층수 버튼을 누르고, 지도 도면 위를 <strong>드래그</strong> 하세요.<br>
        2. 등록 창이 뜨면 구체적인 <strong>장소 이름</strong>, <strong>쓰레기통 종류</strong>와 <strong>Spot 등급</strong>을 설정해 줍니다.<br>
        3. 상단의 <strong>실시간 지도 연동</strong>을 켜면 다른 친구들이 등록한 내용과 실시간 상호작용이 가능합니다!
    </div>
    <div class="control-panel">
        <div class="btn-group">
            <button class="floor-btn active" id="btn-f1" onclick="changeFloor('1층')">1층</button>
            <button class="floor-btn" id="btn-f2" onclick="changeFloor('2층')">2층</button>
            <button class="floor-btn" id="btn-f3" onclick="changeFloor('3층')">3층</button>
            <button class="floor-btn" id="btn-f4" onclick="changeFloor('4층')">4층</button>
        </div>
        <div class="btn-group">
            <button class="action-btn btn-db-reset" onclick="resetLocalStorageSecurely()">🔄 지도 전체 초기화</button>
        </div>
    </div>
    <div id="map-wrapper">
        <img id="map-image" src="floor1.jpg" alt="학교 평면도" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'800\' height=\'450\' style=\'background:%23eaeaea;\'><text x=\'50%\' y=\'50%\' font-size=\'15\' fill=\'%23666\' text-anchor=\'middle\'>[도면 로딩 중...] 파일명(floor1.jpg 등)을 확인해 주세요.</text></svg>'">
        <div id="drag-guide-box"></div>
        <div id="marker-container"></div>
    </div>
    
    <div id="add-modal" class="modal-overlay" onclick="closeAddModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header-container">
                <h3 id="add-modal-title">📍 새 쓰레기 수거 구역 등록</h3>
            </div>
            <div class="form-group"><label for="input-location">장소 이름</label><input type="text" id="input-location" placeholder="예: 2층 무용실 앞 복도"></div>
            
            <div class="form-group">
                <label for="input-spot-level">🗑️ 분리수거 및 청결도 등급 (Spot)</label>
                <select id="input-spot-level">
                    <option value="none" selected>⚪ 선택 안 함 (기본 파란색 마커 표시)</option>
                    <option value="green">🟢 Green Spot (모범 구역 - 분리수거 깨끗함)</option>
                    <option value="yellow">🟡 Yellow Spot (보통 구역 - 분리수거 및 관리 필요)</option>
                    <option value="red">🔴 Red Spot (취약 구역 - 무단 투기 심각 및 엉망)</option>
                </select>
            </div>

            <div class="form-group">
                <label>배치된 쓰레기통 목록</label>
                <div class="checkbox-grid">
                    <label class="checkbox-item"><input type="checkbox" name="bin-types" value="일반 쓰레기통"><span>일반 쓰레기</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="bin-types" value="재활용 분리수거함 (혼합)"><span>혼합 분리함</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="bin-types" value="페트병 / 캔 전용함"><span>페트 / 캔함</span></label>
                    <label class="checkbox-item"><input type="checkbox" name="bin-types" value="종이 수거 전용 상자"><span>종이 수거함</span></label>
                    <label class="checkbox-item full-width" style="color: var(--danger-color); font-weight: bold;"><input type="checkbox" name="bin-types" value="쓰레기 무단 방치 구역 (경고)"><span>⚠️ 무단 방치 구역 (경고)</span></label>
                </div>
            </div>
            <div class="form-group"><label for="input-desc">현황 기록 메모</label><textarea id="input-desc" rows="2" placeholder="세부 특징을 적어주세요."></textarea></div>
            
            <div class="form-group lock-option-box">
                <label class="checkbox-item" style="color: var(--primary-dark); font-weight: bold;">
                    <input type="checkbox" id="input-is-locked">
                    <span>🔒 이 구역 비밀번호 잠금 (타인 삭제 금지)</span>
                </label>
            </div>

            <div id="add-error-msg" class="error-message"></div>
            <div class="modal-buttons"><button class="modal-btn btn-cancel" onclick="closeAddModal()">취소</button><button class="modal-btn btn-save" id="btn-save-main" onclick="saveMarkerData()">구역 저장</button></div>
        </div>
    </div>
    
    <div id="view-modal" class="modal-overlay" onclick="closeViewModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header-container">
                <h3 id="view-title">배치 현황 리포트</h3>
                <button class="edit-inline-btn" onclick="switchToEditMode()">✏️ 수정</button>
            </div>
            <div style="font-size: 13.5px; line-height: 1.6;">
                <p><span class="info-label">📍 위치:</span> <span id="view-location" style="font-weight: bold;"></span></p>
                <p style="margin-bottom: 2px;"><span class="info-label">📋 상태/종류:</span></p>
                <div id="view-pills" class="info-pill-container"></div>
                <p><span class="info-label">📝 보고메모:</span> <span id="view-desc" style="color:#555;"></span></p>
            </div>
            <div class="modal-buttons"><button class="modal-btn btn-delete" id="delete-btn">이 구역 삭제</button><button class="modal-btn btn-cancel" onclick="closeViewModal()" style="background: var(--primary-color); color: white;">닫기</button></div>
        </div>
    </div>
    
    <script>
        // ⚠️ 아래 두 항목을 본인의 Supabase 정보로 채워주세요!
        const SUPABASE_URL = "https://aswipaalqeiforwdgltg.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_41VovqaOxhgqDpXBUamLxA_8mscN_Xq";
        
        let supabaseClient = null;
        if(SUPABASE_URL !== "YOUR_SUPABASE_URL") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let currentFloor = "1층", currentSelectedMarkerId = null, isDragging = false, isEditMode = false;
        let dragStartCoords = { x: 0, y: 0 }, dragEndCoords = { x: 0, y: 0 }, activeSavedCoords = { x: 0, y: 0, width: 0, height: 0 }, trashBins = [];
        let isOnlineMode = false, supabaseSubscription = null;
        const MASTER_PASSWORD = "0701";

        window.onload = function() { 
            initInteractionEvents(); 
            // 이전에 설정했던 동기화 모드 상태 가져오기
            const savedSync = localStorage.getItem('sync_mode_enabled');
            if (savedSync === 'true' && supabaseClient) {
                document.getElementById('sync-toggle').checked = true;
                toggleSyncMode();
            } else {
                loadFromLocalStorage(); 
            }
        }

        async function toggleSyncMode() {
            const toggle = document.getElementById('sync-toggle');
            const status = document.getElementById('sync-status');
            
            if(!supabaseClient) {
                alert("Supabase API 키가 설정되지 않아 연동 모드를 켤 수 없습니다. 소스코드를 확인해주세요!");
                toggle.checked = false;
                return;
            }

            isOnlineMode = toggle.checked;
            localStorage.setItem('sync_mode_enabled', isOnlineMode);

            if (isOnlineMode) {
                status.innerText = "온라인 실시간 연동 중";
                status.className = "status-badge status-on";
                await fetchFromSupabase();
                subscribeToSupabase();
            } else {
                status.innerText = "오프라인 모드";
                status.className = "status-badge status-off";
                if(supabaseSubscription) {
                    supabaseClient.channel('schema-db-changes').unsubscribe();
                }
                loadFromLocalStorage();
            }
        }

        async function fetchFromSupabase() {
            if (!isOnlineMode) return;
            const { data, error } = await supabaseClient.from('school_trash').select('*');
            if (!error && data) {
                trashBins = data.map(item => ({
                    id: item.id, floorName: item.floor_name, x: item.x, y: item.y, width: item.width, height: item.height,
                    location: item.location, types: item.types, desc: item.description, isLocked: item.is_locked, spotLevel: item.spot_level
                }));
                renderMarkers();
            }
        }

        function subscribeToSupabase() {
            supabaseSubscription = supabaseClient.channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'school_trash' }, () => {
                fetchFromSupabase();
            }).subscribe();
        }

        function autoSaveToLocalStorage() { if(!isOnlineMode) localStorage.setItem('school_trash_data_permanent', JSON.stringify(trashBins)); }
        function loadFromLocalStorage() { const savedData = localStorage.getItem('school_trash_data_permanent'); trashBins = savedData ? JSON.parse(savedData) : []; renderMarkers(); }
        
        async function resetLocalStorageSecurely() {
            const inputPw = prompt("🔒 지도 전체 초기화 잠금\n통합 비밀번호를 입력해야 모든 데이터가 리셋됩니다:");
            if (inputPw === null) return;
            if (inputPw !== MASTER_PASSWORD) { alert("❌ 비밀번호가 올바르지 않습니다."); return; }
            
            if (confirm("정말로 모든 데이터를 공장초기화 하시겠습니까?")) {
                if (isOnlineMode) {
                    const { error } = await supabaseClient.from('school_trash').delete().neq('id', 0);
                    if(error) alert("서버 리셋 실패: " + error.message);
                } else {
                    localStorage.removeItem('school_trash_data_permanent');
                    trashBins = [];
                    renderMarkers();
                }
                alert("모든 데이터가 깨끗하게 리셋되었습니다.");
            }
        }
        
        function changeFloor(floor) {
            currentFloor = floor; document.getElementById('btn-f1').classList.remove('active'); document.getElementById('btn-f2').classList.remove('active'); document.getElementById('btn-f3').classList.remove('active'); document.getElementById('btn-f4').classList.remove('active');
            const mapImage = document.getElementById('map-image');
            if (floor === '1층') { document.getElementById('btn-f1').classList.add('active'); mapImage.src = 'floor1.jpg'; }
            else if (floor === '2층') { document.getElementById('btn-f2').classList.add('active'); mapImage.src = 'floor2.jpg'; }
            else if (floor === '3층') { document.getElementById('btn-f3').classList.add('active'); mapImage.src = 'floor3.jpg'; }
            else if (floor === '4층') { document.getElementById('btn-f4').classList.add('active'); mapImage.src = 'floor4.jpg'; }
            renderMarkers();
        }
        
        function renderMarkers() {
            const container = document.getElementById('marker-container'); container.innerHTML = "";
            trashBins.filter(bin => bin.floorName === currentFloor).forEach(bin => {
                const zone = document.createElement('div'); 
                const level = bin.spotLevel || 'none';
                zone.className = `zone-highlight ${level !== 'none' ? 'spot-' + level : ''}`;
                zone.style.left = bin.x + "%"; zone.style.top = bin.y + "%"; zone.style.width = bin.width + "%"; zone.style.height = bin.height + "%";
                
                const openModalHandler = (e) => { e.stopPropagation(); e.preventDefault(); openViewModal(bin.id); };
                zone.addEventListener('click', openModalHandler); zone.addEventListener('touchend', openModalHandler);
                container.appendChild(zone);
            });
        }
        
        function initInteractionEvents() {
            const wrapper = document.getElementById('map-wrapper');
            wrapper.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY, e.target));
            window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', (e) => handleDragEnd(e.clientX, e.clientY));
            wrapper.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: false });
            window.addEventListener('touchmove', (e) => { if (!isDragging) return; if (e.cancelable) e.preventDefault(); handleDragMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
            window.addEventListener('touchend', (e) => { if (isDragging) handleDragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });
        }
        
        function handleDragStart(clientX, clientY, target) {
            if (target.closest('.zone-highlight')) return; const rect = document.getElementById('map-wrapper').getBoundingClientRect();
            isDragging = true; dragStartCoords.x = clientX - rect.left; dragStartCoords.y = clientY - rect.top;
            dragEndCoords.x = dragStartCoords.x; dragEndCoords.y = dragStartCoords.y;
            const guide = document.getElementById('drag-guide-box'); guide.style.left = dragStartCoords.x + "px"; guide.style.top = dragStartCoords.y + "px"; guide.style.width = "0px"; guide.style.height = "0px"; guide.style.display = "block";
        }
        
        function handleDragMove(clientX, clientY) {
            if (!isDragging) return; const rect = document.getElementById('map-wrapper').getBoundingClientRect();
            dragEndCoords.x = Math.max(0, Math.min(clientX - rect.left, rect.width)); dragEndCoords.y = Math.max(0, Math.min(clientY - rect.top, rect.height));
            const guide = document.getElementById('drag-guide-box'), w = Math.abs(dragEndCoords.x - dragStartCoords.x), h = Math.abs(dragEndCoords.y - dragStartCoords.y);
            guide.style.left = Math.min(dragStartCoords.x, dragEndCoords.x) + "px"; guide.style.top = Math.min(dragStartCoords.y, dragEndCoords.y) + "px"; guide.style.width = w + "px"; guide.style.height = h + "px";
        }
        
        function handleDragEnd(clientX, clientY) {
            if (!isDragging) return; isDragging = false; const rect = document.getElementById('map-wrapper').getBoundingClientRect();
            document.getElementById('drag-guide-box').style.display = "none";
            const wPx = Math.abs(dragEndCoords.x - dragStartCoords.x), hPx = Math.abs(dragEndCoords.y - dragStartCoords.y);
            if (wPx < 10 || hPx < 10) {
                let cx = Math.max(0, Math.min(clientX - rect.left, rect.width)), cy = Math.max(0, Math.min(clientY - rect.top, rect.height));
                activeSavedCoords = { x: parseFloat(((cx / rect.width) * 100 - 5).toFixed(1)), y: parseFloat(((cy / rect.height) * 100 - 4).toFixed(1)), width: 10, height: 8 };
            } else {
                activeSavedCoords = { x: parseFloat(((Math.min(dragStartCoords.x, dragEndCoords.x) / rect.width) * 100).toFixed(1)), y: parseFloat(((Math.min(dragStartCoords.y, dragEndCoords.y) / rect.height) * 100).toFixed(1)), width: parseFloat(((wPx / rect.width) * 100).toFixed(1)), height: parseFloat(((hPx / rect.height) * 100).toFixed(1)) };
            }
            isEditMode = false;
            openAddModal();
        }
        
        function openAddModal() { 
            document.getElementById('add-error-msg').style.display = 'none'; 
            if (isEditMode) {
                document.getElementById('add-modal-title').innerText = "✏️ 수거 구역 정보 수정";
                document.getElementById('btn-save-main').innerText = "수정 완료";
            } else {
                document.getElementById('add-modal-title').innerText = "📍 새 쓰레기 수거 구역 등록";
                document.getElementById('btn-save-main').innerText = "구역 저장";
                document.getElementById('input-location').value = ""; 
                document.getElementById('input-desc').value = ""; 
                document.getElementById('input-spot-level').value = "none";
                document.getElementById('input-is-locked').checked = false;
                document.querySelectorAll('input[name="bin-types"]').forEach(cb => cb.checked = false);
            }
            document.getElementById('add-modal').classList.add('show'); 
        }
        function closeAddModal() { document.getElementById('add-modal').classList.remove('show'); isEditMode = false; }
        
        async function saveMarkerData() {
            const loc = document.getElementById('input-location').value.trim(), desc = document.getElementById('input-desc').value.trim(), checked = document.querySelectorAll('input[name="bin-types"]:checked'), types = Array.from(checked).map(cb => cb.value);
            const isLocked = document.getElementById('input-is-locked').checked;
            const spotLevel = document.getElementById('input-spot-level').value;
            
            if (!loc || types.length === 0) { const err = document.getElementById('add-error-msg'); err.innerText = "이름과 종류를 입력하세요."; err.style.display = 'block'; return; }
            
            if (isEditMode) {
                const target = trashBins.find(bin => bin.id === currentSelectedMarkerId);
                if (target) { 
                    target.location = loc; target.types = types; target.desc = desc || "세부 기록 없음."; target.isLocked = isLocked; target.spotLevel = spotLevel; 
                    if (isOnlineMode) {
                        await supabaseClient.from('school_trash').update({
                            location: loc, types: types, description: target.desc, is_locked: isLocked, spot_level: spotLevel
                        }).eq('id', currentSelectedMarkerId);
                    }
                }
            } else {
                const newId = Date.now();
                const newBin = { id: newId, floorName: currentFloor, x: activeSavedCoords.x, y: activeSavedCoords.y, width: activeSavedCoords.width, height: activeSavedCoords.height, location: loc, types: types, desc: desc || "세부 기록 없음.", isLocked: isLocked, spotLevel: spotLevel };
                trashBins.push(newBin);
                if (isOnlineMode) {
                    await supabaseClient.from('school_trash').insert([{
                        id: newId, floor_name: currentFloor, x: activeSavedCoords.x, y: activeSavedCoords.y, width: activeSavedCoords.width, height: activeSavedCoords.height, location: loc, types: types, description: newBin.desc, is_locked: isLocked, spot_level: spotLevel
                    }]);
                }
            }
            closeAddModal(); autoSaveToLocalStorage(); renderMarkers();
        }
        
        function openViewModal(id) {
            currentSelectedMarkerId = id; const target = trashBins.find(bin => bin.id === id);
            if (target) {
                document.getElementById('view-title').innerText = `${target.floorName} 리포트`; document.getElementById('view-location').innerText = target.location; document.getElementById('view-desc').innerText = target.desc;
                const container = document.getElementById('view-pills'); container.innerHTML = "";
                
                if (target.isLocked) {
                    const lockPill = document.createElement('span'); lockPill.className = 'info-pill pill-lock'; lockPill.innerText = "🔒 보안 잠금";
                    container.appendChild(lockPill);
                }

                const spotLevel = target.spotLevel || 'none';
                if (spotLevel !== 'none') {
                    const spotPill = document.createElement('span');
                    spotPill.className = `info-pill pill-spot-${spotLevel}`;
                    if (spotLevel === 'green') spotPill.innerText = "🟢 Green Spot";
                    else if (spotLevel === 'red') spotPill.innerText = "🔴 Red Spot";
                    else spotPill.innerText = "🟡 Yellow Spot";
                    container.appendChild(spotPill);
                }

                target.types.forEach(type => {
                    const pill = document.createElement('span'); pill.className = 'info-pill'; pill.innerText = type;
                    if (type === "일반 쓰레기통") pill.classList.add('pill-general'); else if (type === "재활용 분리수거함 (혼합)") pill.classList.add('pill-mix'); else if (type === "페트병 / 캔 전용함") pill.classList.add('pill-pet'); else if (type === "종이 수거 전용 상자") pill.classList.add('pill-paper'); else if (type === "쓰레기 무단 방치 구역 (경고)") pill.classList.add('pill-danger');
                    container.appendChild(pill);
                });
                
                document.getElementById('delete-btn').onclick = async function() {
                    if (target.isLocked) {
                        const pw = prompt("🔒 이 구역은 보안 잠금이 설정되어 있습니다.\n비밀번호를 입력하세요:");
                        if (pw !== MASTER_PASSWORD) { alert("❌ 비밀번호가 올바르지 않습니다. 삭제가 거부되었습니다."); return; }
                    }
                    if (confirm("정말로 이 구역을 삭제하시겠습니까?")) {
                        if (isOnlineMode) {
                            await supabaseClient.from('school_trash').delete().eq('id', id);
                        } else {
                            trashBins = trashBins.filter(bin => bin.id !== id);
                            autoSaveToLocalStorage();
                            renderMarkers();
                        }
                        closeViewModal();
                    }
                };
                document.getElementById('view-modal').classList.add('show');
            }
        }
        function closeViewModal() { document.getElementById('view-modal').classList.remove('show'); }
        
        function switchToEditMode() {
            const target = trashBins.find(bin => bin.id === currentSelectedMarkerId);
            if (target) {
                if (target.isLocked) {
                    const pw = prompt("🔒 이 구역은 보안 잠금이 설정되어 있습니다.\n수정하려면 비밀번호를 입력하세요:");
                    if (pw !== MASTER_PASSWORD) { alert("❌ 비밀번호가 올바르지 않습니다. 수정이 거부되었습니다."); return; }
                }
                
                isEditMode = true; closeViewModal();
                document.getElementById('input-location').value = target.location;
                document.getElementById('input-desc').value = target.desc === "세부 기록 없음." ? "" : target.desc;
                document.getElementById('input-is-locked').checked = target.isLocked || false;
                document.getElementById('input-spot-level').value = target.spotLevel || "none";
                document.querySelectorAll('input[name="bin-types"]').forEach(cb => { cb.checked = target.types.includes(cb.value); });
                openAddModal();
            }
        }
    </script>
</body>
